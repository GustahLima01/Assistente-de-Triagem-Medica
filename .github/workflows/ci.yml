name: CI

on:
  workflow_dispatch:
    inputs:
      run_performance:
        description: Run optional k6 performance tests
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - develop
      - feature/**
      - bugfix/**
      - hotfix/**
      - release/**
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint when available
        run: npm run --if-present lint

      - name: Run build when available
        run: npm run --if-present build

      - name: Run unit tests
        run: npm run test:unit

      - name: Run functional tests with report
        run: npm run test:functional:report

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-report
          path: reports/api-tests
          if-no-files-found: warn

  performance:
    if: github.event_name == 'workflow_dispatch' && inputs.run_performance
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run performance tests
        run: npm run test:performance

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-report
          path: reports/performance
          if-no-files-found: warn
